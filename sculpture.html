<!DOCTYPE html>
<html>
<head>
    <title>Sculpture | Omar El-Sabrout</title>
    <style>
        body { background-color: #f0caad; font-family: sans-serif; text-align: center; padding: 20px; }
        
        /* Slideshow CSS */
        .slideshow-container { max-width: 800px; position: relative; margin: 40px auto; overflow: hidden; }
        .slide img { width: auto; height: auto; max-width: 100%; max-height: 80vh; object-fit: contain; display: block; margin: 0 auto; border-radius: 12px; }
        .prev, .next { cursor: pointer; position: absolute; top: 50%; padding: 12px; color: white; font-weight: bold; font-size: 24px; transition: 0.3s ease; user-select: none; background-color: rgba(0,0,0,0.3); border-radius: 50%; transform: translateY(-50%); }
        .prev { left: 10px; }
        .next { right: 10px; }
        .prev:hover, .next:hover { background-color: rgba(0,0,0,0.6); }
        .dot { cursor: pointer; height: 12px; width: 12px; margin: 0 3px; background-color: #bbb; border-radius: 50%; display: inline-block; transition: background-color 0.3s; }
        .active, .dot:hover { background-color: #717171; }
        .fade { animation: fadeEffect 1s; }
        @keyframes fadeEffect { from {opacity: 0.4} to {opacity: 1} }
    </style>
</head>
<body>
    <h1>Sculpture</h1>
    <a href="index.html">[← Back Home]</a>

    <div class="slideshow-container">
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <div class="dots" style="text-align:center"></div>

    <script src="gallery_data.js"></script>
    <script>
        // Fisher-Yates Shuffle
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // UPDATE THIS LIST WITH YOUR SCULPTURE IMAGES ONLY
        const images = shuffle([...sculptureImages]); 
        
        const slideshowContainer = document.querySelector('.slideshow-container');
        const dotsContainer = document.querySelector('.dots');
        let slideIndex = 1;

        images.forEach((filename, i) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = 'slide fade';
            const img = document.createElement('img');
            img.src = `images/sculpture/${filename}`;
            slideDiv.appendChild(img);
            slideshowContainer.insertBefore(slideDiv, slideshowContainer.firstChild.nextSibling);
            
            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.addEventListener('click', () => currentSlide(i + 1));
            dotsContainer.appendChild(dot);
        });

        function showSlides(n) {
            const slides = document.getElementsByClassName("slide");
            const dots = document.getElementsByClassName("dot");
            if (n > slides.length) { slideIndex = 1; }
            if (n < 1) { slideIndex = slides.length; }
            for (let slide of slides) slide.style.display = "none";
            for (let dot of dots) dot.className = dot.className.replace(" active", "");
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";
        }

        function plusSlides(n) { showSlides(slideIndex += n); }
        function currentSlide(n) { showSlides(slideIndex = n); }
        showSlides(slideIndex);
    </script>
</body>
</html>
